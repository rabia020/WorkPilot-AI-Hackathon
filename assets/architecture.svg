  <line x1="715" y1="1213" x2="590" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="821" y1="1213" x2="720" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="100" y="1235" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="180" y="1265" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Gmail</text>
  </g>
  <g>
    <rect x="280" y="1235" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="360" y="1265" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Calendar</text>
  </g>
  <g>
    <rect x="460" y="1235" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="540" y="1265" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Jira</text>
  </g>
  <g>
    <rect x="640" y="1235" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="720" y="1265" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Slack</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="11" fill="#444441">
    <rect x="640" y="232" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="660" y="243">LangGraph node (Python)</text>
    <rect x="640" y="252" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D"/>
    <text x="660" y="263">human approval gate</text>
    <rect x="640" y="272" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B"/>
    <text x="660" y="283">n8n: agent + tool nodes</text>
    <rect x="640" y="292" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="660" y="303">read-only path</text>
