<svg width="900" height="1320" viewBox="0 0 900 1320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Enterprise AI Assistant — architecture</title>
  <desc>User request enters through a Streamlit frontend, hits a FastAPI backend, which invokes a LangGraph supervisor. LangGraph application boundary separated from the external n8n workflow boundary. Memory load, supervisor classification, planner, one of nine specialist agents, a branch into auto-complete or human review, an action dispatcher that executes approved actions and saves memory, then a handoff to n8n's AI agent and its tool nodes. Jira tools exist in n8n but are not yet reachable from any agent.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1320" fill="#FFFFFF"/>

  <!-- ================= ENTRY CHAIN ================= -->
  <g>
    <rect x="290" y="20" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="450" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">User</text>
    <text x="450" y="57" text-anchor="middle" font-size="11" fill="#444441">Employee / manager</text>
  </g>
  <line x1="450" y1="70" x2="450" y2="98" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="98" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="450" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Streamlit frontend</text>
    <text x="450" y="135" text-anchor="middle" font-size="11" fill="#444441">streamlit_app.py, chat_panel.py</text>
  </g>
  <line x1="450" y1="148" x2="450" y2="176" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="176" width="320" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="450" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">FastAPI backend</text>
    <text x="450" y="213" text-anchor="middle" font-size="11" fill="#444441">app.py — /chat and /review</text>
  </g>
  <line x1="450" y1="226" x2="450" y2="254" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ================= BOUNDARY CONTAINERS ================= -->
  <rect x="20" y="224" width="860" height="641" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="35" y="242" font-size="12" font-weight="600" fill="#5F5E5A">LangGraph application (Python)</text>

  <rect x="15" y="870" width="870" height="440" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="35" y="890" font-size="12" font-weight="600" fill="#5F5E5A">n8n workflow (external service)</text>

  <!-- ================= PIPELINE (purple / LangGraph) ================= -->
  <g>
    <rect x="290" y="255" width="320" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="278" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Memory load</text>
    <text x="450" y="297" text-anchor="middle" font-size="12" fill="#3C3489">Restore prior session context</text>
  </g>
  <line x1="450" y1="315" x2="450" y2="345" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="345" width="320" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Supervisor</text>
    <text x="450" y="387" text-anchor="middle" font-size="12" fill="#3C3489">Classify query type (rules + LLM)</text>
  </g>
  <line x1="450" y1="405" x2="450" y2="435" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="435" width="320" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Planner</text>
    <text x="450" y="477" text-anchor="middle" font-size="12" fill="#3C3489">LLM drafts a step-by-step plan</text>
  </g>
  <line x1="450" y1="495" x2="450" y2="525" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="525" width="320" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="548" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Specialist agent</text>
    <text x="450" y="567" text-anchor="middle" font-size="12" fill="#3C3489">Selected based on query type</text>
  </g>

  <line x1="610" y1="555" x2="630" y2="425" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 2"/>
  <rect x="630" y="350" width="230" height="150" rx="8" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.75"/>
  <text x="642" y="368" font-size="11" font-weight="600" fill="#444441">Specialist agents (6)</text>
  <text x="642" y="386" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">├── Email agent</text>
  <text x="642" y="402" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">├── Calendar agent</text>
  <text x="642" y="418" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">├── RAG / docs agent</text>
  <text x="642" y="434" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">├── Slack agent</text>
  <text x="642" y="450" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">├── Research agent</text>
  <text x="642" y="466" font-size="10" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">└── Reporter agent</text>

  <line x1="450" y1="585" x2="230" y2="625" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="585" x2="670" y2="625" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="625" width="300" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="230" y="648" text-anchor="middle" font-size="15" font-weight="600" fill="#04342C">Auto-complete</text>
    <text x="230" y="667" text-anchor="middle" font-size="12" fill="#085041">Read-only: docs, research, listings</text>
  </g>
  <line x1="230" y1="685" x2="230" y2="715" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <g>
    <rect x="80" y="715" width="300" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="230" y="737" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">End</text>
    <text x="230" y="754" text-anchor="middle" font-size="12" fill="#444441">Memory saved, nothing to approve</text>
  </g>

  <g>
    <rect x="520" y="625" width="300" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
    <text x="670" y="648" text-anchor="middle" font-size="15" font-weight="600" fill="#4A1B0C">Human review</text>
    <text x="670" y="667" text-anchor="middle" font-size="12" fill="#712B13">Approve or reject proposed action</text>
  </g>
  <text x="605" y="705" text-anchor="middle" font-size="12" fill="#444441">reject</text>
  <line x1="620" y1="685" x2="590" y2="715" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="745" y="705" text-anchor="middle" font-size="12" fill="#444441">approve</text>
  <line x1="720" y1="685" x2="750" y2="715" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="520" y="715" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="590" y="737" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">End</text>
    <text x="590" y="754" text-anchor="middle" font-size="11" fill="#444441">Not executed</text>
  </g>

  <g>
    <rect x="680" y="715" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="750" y="737" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Approved</text>
    <text x="750" y="754" text-anchor="middle" font-size="11" fill="#3C3489">continues below</text>
  </g>

  <line x1="750" y1="765" x2="450" y2="795" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="795" width="400" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="816" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">Action dispatcher</text>
    <text x="450" y="835" text-anchor="middle" font-size="10.5" fill="#3C3489">Executes approved action and persists conversation state</text>
  </g>
  <line x1="450" y1="855" x2="450" y2="885" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ================= EXECUTION LAYER (amber / n8n) ================= -->
  <g>
    <rect x="290" y="885" width="320" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="450" y="908" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">n8n_client.py</text>
    <text x="450" y="927" text-anchor="middle" font-size="12" fill="#633806">Builds one natural-language chatInput</text>
  </g>
  <line x1="450" y1="945" x2="450" y2="975" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="975" width="320" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="450" y="998" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">n8n webhook</text>
    <text x="450" y="1017" text-anchor="middle" font-size="12" fill="#633806">POST /webhook/copilot-actions</text>
  </g>
  <line x1="450" y1="1035" x2="450" y2="1065" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="90" y="1065" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="165" y="1088" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Mistral chat model</text>
    <text x="165" y="1107" text-anchor="middle" font-size="11" fill="#633806">Reasoning engine for the agent</text>
  </g>
  <text x="265" y="1090" text-anchor="middle" font-size="11" fill="#444441">LLM</text>
  <line x1="240" y1="1095" x2="290" y2="1095" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="290" y="1065" width="320" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="450" y="1088" text-anchor="middle" font-size="15" font-weight="600" fill="#412402">n8n AI agent</text>
    <text x="450" y="1107" text-anchor="middle" font-size="12" fill="#633806">Picks a tool, calls it, replies to webhook</text>
  </g>

  <line x1="450" y1="1125" x2="79"  y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="185" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="291" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="397" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="503" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="609" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="715" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="450" y1="1125" x2="821" y2="1165" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <g>
    <rect x="29"  y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="79" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">Get_Gmail</text>
  </g>
  <g>
    <rect x="135" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="185" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">Send_Email</text>
  </g>
  <g>
    <rect x="241" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="291" y="1187" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">Create_Calendar</text>
    <text x="291" y="1199" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">_Event</text>
  </g>
  <g>
    <rect x="347" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="397" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">Get_All_Events</text>
  </g>
  <g>
    <rect x="453" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="503" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">CreateJiraIssue</text>
  </g>
  <g>
    <rect x="559" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="609" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">GetManyIssues</text>
  </g>
  <g>
    <rect x="665" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="715" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">UpdateJiraIssue</text>
  </g>
  <g>
    <rect x="771" y="1165" width="100" height="48" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
    <text x="821" y="1193" text-anchor="middle" font-size="10.5" font-weight="600" fill="#412402">SendSlackMessage</text>
  </g>

  <line x1="79"  y1="1213" x2="130" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="185" y1="1213" x2="230" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="291" y1="1213" x2="330" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="397" y1="1213" x2="390" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="503" y1="1213" x2="510" y2="1235" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
